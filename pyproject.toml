[build-system]
requires = ["setuptools>=65.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "RPNCalculator"
version = "1.10.3"
description = "Reverse Polish notation calculator"
authors = [{ name = "Phil Hanna", email = "ph1204@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mpmath>=1.2.1",
    "pandas>=2.2",
    "pytest>=7.2",
]

[project.urls]
Homepage = "https://github.com/philhanna/RPNCalculator"

[tool.setuptools]
packages = ["evaluator"]
