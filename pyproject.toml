[build-system]
requires = ["setuptools>=65.1.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "RPNCalculator"
version = "1.10.2"
description = "Reverse Polish notation calculator"
authors = [{ name = "Phil Hanna", email = "ph1204@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mpmath~=1.2.1",
    "pandas~=1.5.1",
]

[project.urls]
Homepage = "https://github.com/philhanna/RPNCalculator"

[tool.setuptools]
packages = ["evaluator"]

[project.optional-dependencies]
dev = [
    "pytest~=7.2.0",
]
